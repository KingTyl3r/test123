  <text x="700" y="90" fill="white" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">
    <tspan fill="#4CAF50" font-weight="700">15.00</tspan> / 30.00 kg
  </text>
  
  <!-- Close Button -->
