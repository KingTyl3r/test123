  <rect x="80" y="118" width="30" height="30" fill="rgba(255,255,255,0.1)" rx="4"/>
  <text x="120" y="140" fill="rgba(255,255,255,0.7)" font-size="10" font-family="Arial, sans-serif">Backpack</text>
  
  <rect x="70" y="160" width="130" height="45" fill="rgba(30,30,40,0.6)" rx="6" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
