<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141420;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#1e1e32;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c83232;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#963232;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3264c8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1e1e64;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c83232;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3232c8;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3264c8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3264c8;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="50" y="50" width="1300" height="700" rx="20" ry="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Top Bar -->
  <rect x="50" y="50" width="1300" height="60" rx="20" ry="20" fill="url(#topBarGrad)"/>
  <rect x="50" y="90" width="1300" height="20" fill="url(#topBarGrad)"/>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Mode Toggle -->
  <rect x="70" y="65" width="200" height="40" rx="10" ry="10" fill="rgba(0,0,0,0.3)"/>
  <rect x="75" y="70" width="90" height="30" rx="8" ry="8" fill="url(#redGrad)"/>
  <text x="120" y="90" fill="white" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Inventory</text>
  <text x="220" y="90" fill="rgba(255,255,255,0.6)" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Utility</text>
  
  <!-- Weight Display -->
