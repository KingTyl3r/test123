<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Glassmorphism Filter -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    <!-- Red-Blue Gradient -->
    <linearGradient id="topBarGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgb(180,40,40);stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:rgb(40,80,180);stop-opacity:0.85"/>
    </linearGradient>
    <!-- Glass Background -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(30,30,45);stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:rgb(20,20,35);stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="rgb(15,15,25)" rx="10"/>
  
  <!-- Main Container -->
  <rect x="50" y="50" width="700" height="500" fill="url(#glassBg)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Top Bar -->
  <rect x="50" y="50" width="700" height="45" fill="url(#topBarGradient)" rx="8"/>
  <rect x="50" y="80" width="700" height="15" fill="url(#topBarGradient)"/>
  
  <!-- Mode Toggle -->
  <rect x="70" y="60" width="80" height="25" fill="rgba(255,255,255,0.25)" rx="4"/>
  <text x="85" y="78" fill="white" font-size="11" font-family="Arial, sans-serif">Inventory</text>
  <rect x="155" y="60" width="60" height="25" fill="rgba(255,255,255,0.1)" rx="4"/>
  <text x="167" y="78" fill="rgba(255,255,255,0.7)" font-size="11" font-family="Arial, sans-serif">Utility</text>
  
  <!-- Weight Display -->
  <text x="400" y="78" fill="white" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">2,500 / 30,000g</text>
  
  <!-- Close Button -->
  <circle cx="720" cy="72" r="14" fill="rgba(255,255,255,0.15)"/>
  <text x="720" y="77" fill="white" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">×</text>
  
  <!-- Left Panel -->
  <!-- Equipment Slots -->
