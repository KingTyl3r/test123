  <rect x="230" y="325" width="22" height="22" rx="5" ry="5" fill="url(#redGrad)"/>
  <text x="241" y="341" fill="white" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  
